<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="ringO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ringG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="128" height="128" rx="30" fill="url(#favBg)" stroke="#8B2490" stroke-width="3" />

  <!-- Rathinam 3 Concentric Rings -->
  <g transform="translate(64, 48)">
    <!-- Top Ring (Orange) -->
    <circle cx="0" cy="-20" r="18" fill="none" stroke="url(#ringO)" stroke-width="8" />
    <circle cx="0" cy="-20" r="5" fill="#FB923C" />

    <!-- Bottom Left Ring (Blue) -->
    <circle cx="-19" cy="14" r="18" fill="none" stroke="url(#ringB)" stroke-width="8" />
    <circle cx="-19" cy="14" r="5" fill="#38BDF8" />

    <!-- Bottom Right Ring (Green) -->
    <circle cx="19" cy="14" r="18" fill="none" stroke="url(#ringG)" stroke-width="8" />
    <circle cx="19" cy="14" r="5" fill="#A3E635" />
  </g>

  <!-- RATHINAM / RGU Text -->
  <text x="64" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" letter-spacing="2">
    RATHINAM
  </text>
</svg>
