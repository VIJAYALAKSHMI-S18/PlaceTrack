<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="100%" height="100%">
  <defs>
    <!-- Multi-color bar gradients -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="25%" stop-color="#8B2490" />
      <stop offset="50%" stop-color="#0084CA" />
      <stop offset="100%" stop-color="#84BD00" />
    </linearGradient>
  </defs>

  <!-- Left: RGU Brand -->
  <g transform="translate(10, 10)">
    <!-- RGU Big Bold Letters -->
    <text x="0" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="#8B2490" letter-spacing="-1">R</text>
    <text x="46" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="#0084CA" letter-spacing="-1">G</text>
    <text x="106" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="#84BD00" letter-spacing="-1">U</text>

    <!-- University Name Block -->
    <g transform="translate(165, 5)">
      <!-- RATHIN@M -->
      <text x="0" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" fill="#8B2490" letter-spacing="1.2">RATHIN<tspan fill="#F97316">@</tspan>M</text>

      <!-- GLOBAL -->
      <g transform="translate(0, 24)">
        <text x="0" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#0084CA" letter-spacing="1">GL</text>
        <!-- Globe in O -->
        <circle cx="39" cy="11" r="7.5" fill="none" stroke="#0084CA" stroke-width="2"/>
        <ellipse cx="39" cy="11" rx="4" ry="7.5" fill="none" stroke="#0084CA" stroke-width="1.2"/>
        <line x1="31.5" y1="11" x2="46.5" y2="11" stroke="#0084CA" stroke-width="1.2"/>
        <text x="49" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#0084CA" letter-spacing="1">BAL</text>
      </g>

      <!-- Deemed to be -->
      <text x="0" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#84BD00" letter-spacing="0.5">Deemed to be</text>

      <!-- UNIVERSITY -->
      <text x="0" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13.5" fill="#F8FAFC" letter-spacing="1.5">UNIVERSITY</text>
    </g>

    <!-- Colored Accent Bar -->
    <rect x="0" y="78" width="310" height="3.5" rx="1.5" fill="url(#barGrad)" />

    <!-- UGC Declaration Line -->
    <text x="155" y="93" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="#94A3B8" letter-spacing="0.6">(DECLARED UNDER SECTION 3 OF UGC ACT, 1956)</text>

    <!-- University of the Future -->
    <g transform="translate(155, 107)">
      <line x1="-120" y1="-3.5" x2="-62" y2="-3.5" stroke="#64748B" stroke-width="1"/>
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" fill="#E2E8F0" letter-spacing="0.5">University of the Future</text>
      <line x1="62" y1="-3.5" x2="120" y2="-3.5" stroke="#64748B" stroke-width="1"/>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="350" y1="12" x2="350" y2="118" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />

  <!-- Right: NAAC Grade A++ Accredited -->
  <g transform="translate(385, 12)">
    <!-- NAAC Text -->
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#8B2490" letter-spacing="2">NAAC</text>
    
    <!-- GRADE Text -->
    <text x="0" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" fill="#F8FAFC" letter-spacing="2">GRADE</text>

    <!-- Big A++ -->
    <g transform="translate(138, 62)">
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#8B2490">A</text>
      <text x="44" y="-12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#F8FAFC">++</text>
    </g>

    <!-- Horizontal Underline for NAAC -->
    <line x1="0" y1="78" x2="275" y2="78" stroke="#8B2490" stroke-width="2.5" />

    <!-- ACCREDITED Text -->
    <text x="137" y="96" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#F8FAFC" letter-spacing="7">ACCREDITED</text>
  </g>
</svg>
