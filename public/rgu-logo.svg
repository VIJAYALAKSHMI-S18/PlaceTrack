<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <!-- Ring Gradients -->
    <linearGradient id="ringOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="ringBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ringGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>
    <linearGradient id="fullBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="25%" stop-color="#8B2490" />
      <stop offset="50%" stop-color="#0084CA" />
      <stop offset="100%" stop-color="#84BD00" />
    </linearGradient>
  </defs>

  <!-- 1. LEFT: THE 3 ICONIC RATHINAM CIRCLES / RINGS EMBLEM -->
  <g transform="translate(10, 10)">
    <!-- 'Celebrate life' cursive tagline -->
    <text x="50" y="14" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-style="italic" font-size="11" fill="#E2E8F0" letter-spacing="0.5">Celebrate life</text>

    <!-- Top Ring (Orange) -->
    <circle cx="50" cy="38" r="17" fill="none" stroke="url(#ringOrange)" stroke-width="7" />
    <circle cx="50" cy="38" r="4.5" fill="#FB923C" />

    <!-- Bottom Left Ring (Blue) -->
    <circle cx="32" cy="70" r="17" fill="none" stroke="url(#ringBlue)" stroke-width="7" />
    <circle cx="32" cy="70" r="4.5" fill="#38BDF8" />

    <!-- Bottom Right Ring (Green) -->
    <circle cx="68" cy="70" r="17" fill="none" stroke="url(#ringGreen)" stroke-width="7" />
    <circle cx="68" cy="70" r="4.5" fill="#A3E635" />

    <!-- Brand Name Under Rings -->
    <text x="50" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#8B2490" letter-spacing="1">
      RATHIN<tspan fill="#F97316">@</tspan>M
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="115" y1="15" x2="115" y2="120" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- 2. MIDDLE: RGU & GLOBAL UNIVERSITY TYPOGRAPHY -->
  <g transform="translate(130, 10)">
    <!-- RGU Giant Bold Letters -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" fill="#8B2490" letter-spacing="-1">R</text>
    <text x="49" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" fill="#0084CA" letter-spacing="-1">G</text>
    <text x="112" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" fill="#84BD00" letter-spacing="-1">U</text>

    <!-- University Name Block -->
    <g transform="translate(176, 8)">
      <!-- RATHIN@M -->
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#8B2490" letter-spacing="1.2">
        RATHIN<tspan fill="#F97316">@</tspan>M
      </text>

      <!-- GLOBAL -->
      <g transform="translate(0, 25)">
        <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" fill="#0084CA" letter-spacing="1">GL</text>
        <!-- Globe icon in O -->
        <circle cx="41" cy="11.5" r="8" fill="none" stroke="#0084CA" stroke-width="2"/>
        <ellipse cx="41" cy="11.5" rx="4.2" ry="8" fill="none" stroke="#0084CA" stroke-width="1.2"/>
        <line x1="33" y1="11.5" x2="49" y2="11.5" stroke="#0084CA" stroke-width="1.2"/>
        <text x="52" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" fill="#0084CA" letter-spacing="1">BAL</text>
      </g>

      <!-- Deemed to be -->
      <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#84BD00" letter-spacing="0.5">Deemed to be</text>

      <!-- UNIVERSITY -->
      <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="1.5">UNIVERSITY</text>
    </g>

    <!-- Colored Accent Bar Under RGU -->
    <rect x="0" y="82" width="330" height="3.5" rx="1.5" fill="url(#fullBarGrad)" />

    <!-- UGC Declaration Line -->
    <text x="165" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#94A3B8" letter-spacing="0.6">
      (DECLARED UNDER SECTION 3 OF UGC ACT, 1956)
    </text>

    <!-- University of the Future -->
    <g transform="translate(165, 113)">
      <line x1="-130" y1="-3.5" x2="-68" y2="-3.5" stroke="#64748B" stroke-width="1"/>
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#E2E8F0" letter-spacing="0.5">
        University of the Future
      </text>
      <line x1="68" y1="-3.5" x2="130" y2="-3.5" stroke="#64748B" stroke-width="1"/>
    </g>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="535" y1="15" x2="535" y2="120" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- 3. RIGHT: NAAC GRADE A++ ACCREDITED -->
  <g transform="translate(565, 15)">
    <!-- NAAC Text -->
    <text x="0" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#8B2490" letter-spacing="2">NAAC</text>
    
    <!-- GRADE Text -->
    <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="2">GRADE</text>

    <!-- Big A++ -->
    <g transform="translate(148, 66)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="68" fill="#8B2490">A</text>
      <text x="48" y="-14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">++</text>
    </g>

    <!-- Horizontal Underline for NAAC -->
    <line x1="0" y1="84" x2="295" y2="84" stroke="#8B2490" stroke-width="2.5" />

    <!-- ACCREDITED Text -->
    <text x="147" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="7">
      ACCREDITED
    </text>
  </g>
</svg>
