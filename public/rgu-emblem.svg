<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ringOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="ringGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ringBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#6366F1" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Rathinam 3 Rings Emblem -->
  <g transform="translate(12, 10)">
    <!-- Top Ring (Orange) -->
    <circle cx="38" cy="24" r="16" fill="none" stroke="url(#ringOrange)" stroke-width="7" />
    <!-- Bottom Left Ring (Green) -->
    <circle cx="22" cy="52" r="16" fill="none" stroke="url(#ringGreen)" stroke-width="7" />
    <!-- Bottom Right Ring (Blue) -->
    <circle cx="54" cy="52" r="16" fill="none" stroke="url(#ringBlue)" stroke-width="7" />
    <!-- Center Dot Connector -->
    <circle cx="38" cy="43" r="4.5" fill="#FFFFFF" />

    <text x="38" y="77" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#38BDF8" letter-spacing="1.5">RGU</text>
  </g>
</svg>
